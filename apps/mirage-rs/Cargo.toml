[package]
name = "mirage-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "In-process Ethereum fork simulator with lazy upstream reads, copy-on-write scenario branching, and JSON-RPC server."

[lib]
name = "mirage_rs"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "mirage-rs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
alloy-primitives = { workspace = true, features = ["serde"] }
clap = { workspace = true }
futures = { workspace = true }
futures-util = "0.3"
golem-core = { path = "../../crates/golem-core", optional = true }
jsonrpsee = { version = "0.26", features = ["server", "http-client"] }
lru = "0.12"
dashmap = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.33"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa"] }
tower = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = ["binary", "golem"]
binary = []
library = []
sim-gas = []
golem = ["dep:golem-core"]
