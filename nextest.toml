[profile.default]
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
status-level = "pass"
final-status-level = "flaky"

[[profile.default.overrides]]
filter = "package(mirage-rs)"
test-threads = 4

[profile.ci]
fail-fast = true
slow-timeout = { period = "120s", terminate-after = 2 }
status-level = "fail"
final-status-level = "slow"

[profile.ci.junit]
path = "target/nextest/junit.xml"

# Longer timeouts, limited parallelism — for mirage-rs and other integration tests.
[profile.integration]
test-threads = 2
slow-timeout = { period = "120s", terminate-after = 1 }
retries = 1
fail-fast = false
status-level = "pass"
final-status-level = "flaky"
