[package]
name = "mpp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Machine Payment Protocol — HTTP 402 payment types, ERC-3009 verification, session management, and USDC settlement primitives."

[lints]
workspace = true

[features]
default = ["session", "db"]
session = ["dashmap", "chrono"]
db = ["rusqlite", "tokio"]

[dependencies]
# Ethereum primitives (Address, U256, keccak256, signature recovery)
alloy = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Session management (optional)
dashmap = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

# SQLite persistence (optional)
rusqlite = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
