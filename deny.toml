[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0"]
deny = ["GPL-2.0", "GPL-3.0", "AGPL-3.0"]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Crates we've chosen alternatives for
deny = [
    # Use parking_lot instead
    { crate = "lazy_static", wrappers = [] },
]

# Allow specific duplicate versions that are transitive and unavoidable
skip = [
    { crate = "syn@1", reason = "proc-macro deps still use syn 1.x" },
    { crate = "hashbrown@0.14", reason = "transitive from older deps" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
